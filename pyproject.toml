[project]
name = "vertical-slice-template"
version = "0.1.0"
description = "Vertical-slice architecture template for research projects."
authors = [
    {name = "Qingkun Deng", email = "106399042+Ericdqk001@users.noreply.github.com"}
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=2.0.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
    "pyright>=1.1.407",
    "ipykernel>=6.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# List each shippable slice + shared here as you add them.
packages = ["src/shared"]

# UV configuration
[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "D",   # pydocstyle
    "UP",  # pyupgrade
]
ignore = [
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", # Missing docstrings
    "E712",  # Comparison to True/False
    "E741",  # Ambiguous variable name
    "D205",  # 1 blank line required between summary line and description
    "D209",  # Multi-line docstring closing quotes should be on a separate line
    "D210",  # No whitespaces allowed surrounding docstring text
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
# Add each new slice package name here so imports sort as first-party.
known-first-party = ["shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
]

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.pytest_cache"]
extraPaths = ["src"]
pythonPlatform = "All"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
